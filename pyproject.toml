[project]
name = "kubex-codegen"
version = "0.1.0"
description = "Generates the kubex-k8s-* Pydantic model packages from the Kubernetes OpenAPI spec"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT License"}
authors = [
    {name = "Codemageddon", email = "dev@codemageddon.me"},
]
dependencies = [
    "jinja2>=3.1",
    "packaging>=24.0",
    "typer>=0.24.1",
    # The generated code is formatted with ruff, and `verify` runs mypy. Both are
    # pinned so that a kubex-codegen release always produces the same package;
    # the generated pyproject.toml pins the same versions for the package's CI.
    "ruff==0.15.22",
    "mypy==2.4.0",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Code Generators",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
]

[project.scripts]
kubex-codegen = "kubex_codegen.__main__:app"

[project.urls]
Homepage = "https://github.com/kubex-py/kubex-codegen"
Repository = "https://github.com/kubex-py/kubex-codegen.git"
Issues = "https://github.com/kubex-py/kubex-codegen/issues"
Changelog = "https://github.com/kubex-py/kubex-codegen/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    # the end-to-end tests import the models they generate
    "kubex-core>=0.1.0b4,<0.2",
    "pre-commit>=4.0.1",
    "pytest>=8.3.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
only-include = ["kubex_codegen"]

[tool.hatch.build.targets.wheel]
packages = ["kubex_codegen"]

[tool.mypy]
strict = true
exclude = ["tests/golden/"]

[tool.ruff.lint.isort]
known-first-party = ["kubex_codegen"]

[tool.pytest.ini_options]
testpaths = ["tests"]
